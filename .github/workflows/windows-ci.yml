name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  test:
    name: Test ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0

      - name: Validate documentation
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          ./tools/validate_documentation.ps1
          ./tools/validate_publication.ps1

      - name: Build and test
        shell: pwsh
        run: >-
          ./tools/validate_ninja.ps1
          -Configuration ${{ matrix.configuration }}
          -PublicCI
          -EnableCompilerCache

      - name: Upload Windows x64 developer build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: KF2Optimizer-Windows-x64-${{ github.sha }}
          path: |
            out/build/ninja-contract-release/KF2Optimizer.exe
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
