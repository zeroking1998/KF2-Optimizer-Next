name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate documentation
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          ./tools/validate_documentation.ps1
          ./tools/validate_publication.ps1

      - name: Build and test
        shell: pwsh
        run: ./tools/test.ps1 -Configuration ${{ matrix.configuration }} -PublicCI

      - name: Upload Windows x64 developer build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: KF2Optimizer-Windows-x64-${{ github.sha }}
          path: |
            out/build/windows-x64-release/Release/KF2Optimizer.exe
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
