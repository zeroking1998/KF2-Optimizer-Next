name: Bug report
description: Tell us about something that does not work correctly
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please remove names, personal paths, account details, and unrelated process data from screenshots and logs.

  - type: input
    id: version
    attributes:
      label: KF2 Optimizer version
      description: Shown in the app title bar and Diagnostics.
      placeholder: 0.0.4-alpha or commit 4f1052d
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem in simple terms.
      placeholder: The overlay showed 50 FPS while another FPS counter showed 62 FPS.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the smallest steps that make the problem happen.
      placeholder: |
        1. Start KF2 Optimizer
        2. Start KF2 through Steam
        3. Enter an offline match
        4. Open the overlay
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System
      description: Windows version, CPU, GPU, RAM, and display setup.
      placeholder: Windows 11, Ryzen 7 7800X3D, RTX 4090, 32 GB RAM, 2560x1440
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or redacted logs
      description: Optional. Attach only the smallest useful evidence.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue about this problem.
          required: true
        - label: I removed personal information from screenshots and logs.
          required: true
