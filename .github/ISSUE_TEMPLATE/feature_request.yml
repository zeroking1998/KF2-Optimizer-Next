name: Feature request
description: Propose a focused, verifiable improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and how a user knows it worked.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Capability and evidence
      description: What provider, acknowledgement, readback, and restore path could prove it?
  - type: textarea
    id: risks
    attributes:
      label: Safety and compatibility risks
      description: Include failure behavior and the permanent gameplay boundary.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require changing competitive gameplay.
          required: true
