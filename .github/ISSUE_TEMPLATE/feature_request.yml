name: Feature request
description: Suggest a useful improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. A maintainer can help choose the safest implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: It is difficult to understand which Adaptive setting changed.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What should the app do?
      description: Describe the result a user should see.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Who would this help?
      description: Explain when the feature would be useful.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Optional screenshots, examples, alternatives, or safety concerns.
